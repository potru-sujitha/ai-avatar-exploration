<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MPFB avatar POC — TalkingHead engine, real viseme pipeline, professional lighting</title>
<style>
  body, html { width:100%; height:100%; margin:0; background:#202020; color:#eee; font-family:sans-serif; }
  #avatar { display:block; width:940px; height:760px; }
  #panel { position:fixed; top:10px; right:10px; width:420px; }
  button { font-size:16px; padding:6px 14px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
  "talkinghead": "./phase8-talkinghead-experiment/TalkingHead/modules/talkinghead.mjs"
}}
</script>
</head>
<body>
<div id="avatar"></div>
<div id="panel">
  <div id="status">loading...</div><br>
  <button id="play" disabled>Stream real viseme timeline (existing pipeline)</button>
</div>
<script type="module">
import { TalkingHead } from "talkinghead";

const statusEl = document.getElementById('status');
const AVATAR_URL = new URLSearchParams(location.search).get('avatar') || './avatar.glb';
const head = new TalkingHead(document.getElementById('avatar'), { cameraView: 'upper' });

let timeline, pcmInt16;
window.__loadTimeMs = null;

function applyProfessionalLighting() {
  head.setLighting({
    lightAmbientColor: 0xffffff, lightAmbientIntensity: 1.6,
    lightDirectColor: 0xffffff,  lightDirectIntensity: 22,
    lightDirectPhi: 0.85, lightDirectTheta: 1.3,
    lightSpotColor: 0xaaccff, lightSpotIntensity: 8,
    lightSpotPhi: 1.2, lightSpotTheta: 4.8, lightSpotDispersion: 0.8,
  });
  head.renderer.shadowMap.enabled = true;
  head.lightDirect.castShadow = true;
  head.lightDirect.shadow.mapSize.width = 1024;
  head.lightDirect.shadow.mapSize.height = 1024;
  head.lightDirect.shadow.camera.near = 0.1;
  head.lightDirect.shadow.camera.far = 3;
  head.lightDirect.shadow.camera.left = -0.5;
  head.lightDirect.shadow.camera.right = 0.5;
  head.lightDirect.shadow.camera.top = 0.8;
  head.lightDirect.shadow.camera.bottom = -0.3;
  head.lightDirect.shadow.bias = -0.002;
  let meshCount = 0;
  head.armature.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; meshCount++; } });
  return meshCount;
}

// Phase 7 fix for the clothing texture aliasing/moiré Phase 6 found: the suit's diffuse texture
// is a proper power-of-two (2048x2048) and its glTF sampler already asks for trilinear filtering
// (magFilter=LINEAR, minFilter=LINEAR_MIPMAP_LINEAR) -- confirmed via direct GLB JSON inspection,
// so mipmapping itself is not missing. What's missing is anisotropic filtering: Three.js's
// GLTFLoader leaves every texture at its default texture.anisotropy = 1 (none), and this exact
// test harness never set it either. Anisotropic filtering is specifically the fix for a
// high-frequency repeating pattern (the suit's stripes) viewed at a grazing angle on curved
// geometry (chest, shoulders) -- precisely the "worse on curved surfaces" symptom Phase 6
// described. This changes only runtime texture state on the loaded scene; it does not modify
// TalkingHead's own engine source.
function applyAnisotropicFiltering() {
  const maxAniso = head.renderer.capabilities.getMaxAnisotropy();
  let texCount = 0;
  head.armature.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap']) {
        const tex = m[key];
        if (tex && tex.isTexture) {
          tex.anisotropy = maxAniso;
          tex.needsUpdate = true;
          texCount++;
        }
      }
    }
  });
  return { maxAniso, texCount };
}

async function init() {
  const t0 = performance.now();
  try {
    await head.showAvatar({ url: AVATAR_URL, body: 'F', avatarMood: 'neutral' });
  } catch (err) {
    statusEl.textContent = 'LOAD ERROR: ' + err.message;
    window.__loadError = err.message + '\n' + (err.stack || '');
    return;
  }
  const t1 = performance.now();
  window.__loadTimeMs = t1 - t0;

  let mesh = null;
  let visemeCount = 0;
  let arkitCount = 0;
  head.armature.traverse((o) => {
    if (o.morphTargetDictionary) {
      const keys = Object.keys(o.morphTargetDictionary);
      const v = keys.filter(k => k.startsWith('viseme_')).length;
      if (v > visemeCount) { visemeCount = v; mesh = o; arkitCount = keys.filter(k => !k.startsWith('viseme_')).length; }
    }
  });
  window.__visemeCount = visemeCount;
  window.__arkitCount = arkitCount;

  const meshCount = applyProfessionalLighting();
  window.__shadowMeshCount = meshCount;
  window.__anisoResult = applyAnisotropicFiltering();

  statusEl.textContent = `avatar ready in ${window.__loadTimeMs.toFixed(0)}ms. viseme targets: ${visemeCount}, other morphs: ${arkitCount}`;

  const [tlRes, wavRes] = await Promise.all([fetch('./timeline.json'), fetch('./parity-audio.wav')]);
  timeline = await tlRes.json();
  const wavBytes = await wavRes.arrayBuffer();
  // Strip the 44-byte WAV header; the remainder is 16-bit LE PCM, which streamAudio() accepts directly.
  pcmInt16 = new Int16Array(wavBytes.slice(44));

  document.getElementById('play').disabled = false;
  statusEl.textContent += ` | timeline visemes: ${timeline.visemes.length}`;
  window.__ready = true;
}

document.getElementById('play').addEventListener('click', async () => {
  try {
    if (head.audioCtx.state === 'suspended') await head.audioCtx.resume();
    statusEl.textContent = 'starting stream...';
    await head.streamStart(
      { lipsyncType: 'visemes', waitForAudioChunks: false, sampleRate: 16000 },
      () => { statusEl.textContent = 'audio playback started'; },
      () => { statusEl.textContent = 'audio playback ended'; window.__streamEnded = true; }
    );
    head.streamAudio({ audio: pcmInt16, visemes: timeline.visemes, vtimes: timeline.vtimes, vdurations: timeline.vdurations });
    head.streamNotifyEnd();
    window.__streamStarted = true;
  } catch (err) {
    statusEl.textContent = 'ERROR: ' + err.message;
    window.__streamError = err.message + '\n' + err.stack;
  }
});

init();
window.__head = head;
</script>
</body>
</html>
