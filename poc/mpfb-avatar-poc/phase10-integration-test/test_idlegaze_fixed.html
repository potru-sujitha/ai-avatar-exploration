<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 10 — avatar_v5.glb + Phase 8 IDLE-GAZE-FIXED TalkingHead engine</title>
<style>
  body, html { width:100%; height:100%; margin:0; background:#202020; color:#eee; font-family:sans-serif; }
  #avatar { display:block; width:940px; height:760px; }
  #panel { position:fixed; top:10px; right:10px; width:420px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
  "talkinghead": "../phase8-talkinghead-experiment/TalkingHead/modules/talkinghead.mjs"
}}
</script>
</head>
<body>
<div id="avatar"></div>
<div id="panel"><div id="status">loading...</div></div>
<script type="module">
import { TalkingHead } from "talkinghead";

const statusEl = document.getElementById('status');
const qs = new URLSearchParams(location.search);
const AVATAR_URL = qs.get('avatar') || '../avatar_v5.glb';
const VARIANT = qs.get('variant') || 'default';
const TIMELINE_URL = VARIANT === 'default' ? '../timeline.json' : `./timeline_${VARIANT}.json`;
const WAV_URL = VARIANT === 'default' ? '../parity-audio.wav' : `./${VARIANT}.wav`;
const head = new TalkingHead(document.getElementById('avatar'), { cameraView: qs.get('view') || 'upper' });

window.ENGINE_LABEL = 'idlegaze_fixed';

function applyProfessionalLighting() {
  head.setLighting({
    lightAmbientColor: 0xffffff, lightAmbientIntensity: 1.6,
    lightDirectColor: 0xffffff,  lightDirectIntensity: 22,
    lightDirectPhi: 0.85, lightDirectTheta: 1.3,
    lightSpotColor: 0xaaccff, lightSpotIntensity: 8,
    lightSpotPhi: 1.2, lightSpotTheta: 4.8, lightSpotDispersion: 0.8,
  });
  head.renderer.shadowMap.enabled = true;
  head.lightDirect.castShadow = true;
  head.lightDirect.shadow.mapSize.width = 1024;
  head.lightDirect.shadow.mapSize.height = 1024;
  head.lightDirect.shadow.camera.near = 0.1;
  head.lightDirect.shadow.camera.far = 3;
  head.lightDirect.shadow.camera.left = -0.5;
  head.lightDirect.shadow.camera.right = 0.5;
  head.lightDirect.shadow.camera.top = 0.8;
  head.lightDirect.shadow.camera.bottom = -0.3;
  head.lightDirect.shadow.bias = -0.002;
  head.armature.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}

function applyAnisotropicFiltering() {
  const maxAniso = head.renderer.capabilities.getMaxAnisotropy();
  head.armature.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap']) {
        const tex = m[key];
        if (tex && tex.isTexture) { tex.anisotropy = maxAniso; tex.needsUpdate = true; }
      }
    }
  });
}

async function init() {
  const t0 = performance.now();
  await head.showAvatar({ url: AVATAR_URL, body: 'F', avatarMood: 'neutral' });
  window.__loadTimeMs = performance.now() - t0;

  let mesh = null, visemeCount = 0, arkitCount = 0;
  head.armature.traverse((o) => {
    if (o.morphTargetDictionary) {
      const keys = Object.keys(o.morphTargetDictionary);
      const v = keys.filter(k => k.startsWith('viseme_')).length;
      if (v > visemeCount) { visemeCount = v; mesh = o; arkitCount = keys.filter(k => !k.startsWith('viseme_')).length; }
    }
  });
  window.__visemeCount = visemeCount;
  window.__arkitCount = arkitCount;

  applyProfessionalLighting();
  applyAnisotropicFiltering();

  statusEl.textContent = `ready (${window.ENGINE_LABEL}) in ${window.__loadTimeMs.toFixed(0)}ms. visemes=${visemeCount} other=${arkitCount}`;

  const [tlRes, wavRes] = await Promise.all([fetch(TIMELINE_URL), fetch(WAV_URL)]);
  window.__timeline = await tlRes.json();
  const wavBytes = await wavRes.arrayBuffer();
  window.__pcmInt16 = new Int16Array(wavBytes.slice(44));
  window.__ready = true;
  statusEl.textContent += ` | timeline visemes: ${window.__timeline.visemes.length}`;
}

window.__playTimeline = async function () {
  if (head.audioCtx.state === 'suspended') await head.audioCtx.resume();
  await head.streamStart(
    { lipsyncType: 'visemes', waitForAudioChunks: false, sampleRate: 16000 },
    () => { window.__streamStarted = true; },
    () => { window.__streamEnded = true; }
  );
  head.streamAudio({ audio: window.__pcmInt16, visemes: window.__timeline.visemes, vtimes: window.__timeline.vtimes, vdurations: window.__timeline.vdurations });
  head.streamNotifyEnd();
};

init();
window.__head = head;
</script>
</body>
</html>
