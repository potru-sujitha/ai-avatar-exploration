<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body,html{margin:0;width:100%;height:100%;background:#202020;}#c{width:940px;height:760px;display:block;}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="c"></div>
<div id="status" style="position:fixed;top:10px;left:10px;color:#fff;font-family:sans-serif;">loading...</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const statusEl = document.getElementById('status');
const AVATAR_URL = new URLSearchParams(location.search).get('avatar') || './avatar_v2.glb';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);
const camera = new THREE.PerspectiveCamera(20, 940/760, 0.01, 10);
camera.position.set(0, 1.55, 2.2);
camera.lookAt(0, 1.55, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(940, 760);
document.getElementById('c').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 2.5));
const dir = new THREE.DirectionalLight(0xffffff, 3);
dir.position.set(1, 2, 2);
scene.add(dir);

const loader = new GLTFLoader();
loader.load(AVATAR_URL, (gltf) => {
  scene.add(gltf.scene);
  // NO skinning pose changes, no morph target changes -- pure bind-pose render.
  renderer.render(scene, camera);
  statusEl.textContent = 'loaded and rendered, pure bind pose, no TalkingHead code involved';
  window.__ready = true;
}, undefined, (err) => {
  statusEl.textContent = 'LOAD ERROR: ' + err.message;
});
</script>
</body>
</html>
